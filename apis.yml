aid: phenom
name: Phenom
description: >-
  Phenom is an HR technology company whose Intelligent Talent Experience platform
  applies AI to every stage of the talent lifecycle — helping candidates find and
  apply to the right jobs, recruiters and hiring managers source and engage talent,
  employees grow, and HR teams operate more efficiently. The Phenom Developer Portal
  exposes REST APIs for job sync, candidate management, onboarding, applications and
  applicants, resume and job-description parsing, SCIM 2.0 user and group management,
  candidate tagging, and AI-driven skills prediction, letting partners and ATS/HRIS
  systems integrate with the Phenom platform. Phenom is headquartered in Ambler,
  Pennsylvania and backed by Sierra Ventures among others.
